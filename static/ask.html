<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pipeline Agent AI System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f4f7f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            max-width: 800px;
            margin-top: 40px;
        }
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .badge-rag {
            background-color: #0d6efd;
        }
        .badge-general {
            background-color: #6f42c1;
        }
        .badge-high {
            background-color: #198754;
        }
        .badge-medium {
            background-color: #ffc107;
            color: #000;
        }
        .badge-low {
            background-color: #dc3545;
        }
        .sample-btn {
            font-size: 0.85rem;
            margin-right: 6px;
            margin-bottom: 6px;
        }
        pre {
            background-color: #272822;
            color: #f8f8f2;
            padding: 15px;
            border-radius: 8px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container mb-5">
        <!-- Header -->
        <div class="text-center mb-4">
            <h2 class="fw-bold text-dark"><i class="bi bi-cpu-fill text-primary me-2"></i>Agentic Pipeline System</h2>
            <p class="text-muted">Unified FastAPI Endpoint: Agent Routing &rarr; RAG / LLM &rarr; Evaluation &rarr; Observability</p>
            <div class="d-flex justify-content-center gap-2 mb-3">
                <a href="/" class="btn btn-outline-secondary btn-sm">Home</a>
                <a href="/ask-ui" class="btn btn-primary btn-sm active">Pipeline Demo (/ask)</a>
                <a href="/compare" class="btn btn-outline-secondary btn-sm">Retrieval Compare</a>
                <a href="/benchmark-ui" class="btn btn-outline-secondary btn-sm">Benchmark</a>
            </div>
        </div>

        <!-- Query Form Card -->
        <div class="card p-4 mb-4">
            <label for="queryInput" class="form-label fw-bold">Enter Query:</label>
            <div class="input-group mb-3">
                <input type="text" id="queryInput" class="form-control form-control-lg" placeholder="e.g. What is the capital of France?" value="What is the capital of France?">
                <button class="btn btn-primary px-4 fw-bold" id="askBtn" onclick="sendQuery()">
                    <i class="bi bi-send-fill me-1"></i> Run Pipeline
                </button>
            </div>

            <!-- Sample Queries -->
            <div class="mb-2">
                <span class="text-muted small me-2">Try sample queries:</span>
                <button class="btn btn-light btn-sm border sample-btn" onclick="setQuery('What is the capital of France?')">RAG: France Capital</button>
                <button class="btn btn-light btn-sm border sample-btn" onclick="setQuery('Tell me about the economy of France')">RAG: France Economy</button>
                <button class="btn btn-light btn-sm border sample-btn" onclick="setQuery('What is quantum computing?')">General: Quantum Computing</button>
                <button class="btn btn-light btn-sm border sample-btn" onclick="setQuery('Write a quick poem about space')">General: Poem</button>
            </div>
        </div>

        <!-- Response Container -->
        <div id="responseCard" class="card p-4 d-none">
            <h5 class="fw-bold mb-3"><i class="bi bi-check-circle-fill text-success me-2"></i>Pipeline Result</h5>
            
            <div class="d-flex gap-3 mb-3">
                <div>
                    <span class="text-muted small d-block">Execution Mode:</span>
                    <span id="modeBadge" class="badge badge-rag fs-6 px-3 py-2">RAG</span>
                </div>
                <div>
                    <span class="text-muted small d-block">Evaluated Confidence:</span>
                    <span id="confidenceBadge" class="badge badge-high fs-6 px-3 py-2">High</span>
                </div>
            </div>

            <div class="mb-4">
                <span class="text-muted small d-block mb-1">Answer:</span>
                <div id="answerBox" class="p-3 bg-light rounded border fs-6 text-dark" style="white-space: pre-wrap;"></div>
            </div>

            <div>
                <span class="text-muted small d-block mb-1">JSON API Output (`/ask`):</span>
                <pre><code id="jsonOutput"></code></pre>
            </div>
        </div>
    </div>

    <script>
        function setQuery(text) {
            document.getElementById('queryInput').value = text;
            sendQuery();
        }

        async function sendQuery() {
            const query = document.getElementById('queryInput').value.trim();
            if (!query) return;

            const btn = document.getElementById('askBtn');
            const responseCard = document.getElementById('responseCard');
            const answerBox = document.getElementById('answerBox');
            const jsonOutput = document.getElementById('jsonOutput');
            const modeBadge = document.getElementById('modeBadge');
            const confidenceBadge = document.getElementById('confidenceBadge');

            btn.disabled = true;
            btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> Processing...`;

            try {
                const res = await fetch('/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query })
                });

                const data = await res.json();

                // Show response card
                responseCard.classList.remove('d-none');

                // Update Mode Badge
                modeBadge.textContent = (data.mode || 'unknown').toUpperCase();
                modeBadge.className = 'badge fs-6 px-3 py-2 ' + (data.mode === 'rag' ? 'badge-rag' : 'badge-general');

                // Update Confidence Badge
                confidenceBadge.textContent = data.confidence || 'N/A';
                let confClass = 'badge-medium';
                if (data.confidence === 'High') confClass = 'badge-high';
                if (data.confidence === 'Low') confClass = 'badge-low';
                confidenceBadge.className = 'badge fs-6 px-3 py-2 ' + confClass;

                // Update Answer & JSON
                answerBox.textContent = data.answer || 'No response returned.';
                jsonOutput.textContent = JSON.stringify(data, null, 2);

            } catch (err) {
                responseCard.classList.remove('d-none');
                answerBox.textContent = "Error calling /ask endpoint: " + err.message;
                jsonOutput.textContent = JSON.stringify({ error: err.message }, null, 2);
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="bi bi-send-fill me-1"></i> Run Pipeline`;
            }
        }
    </script>
</body>
</html>
